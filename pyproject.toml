[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".python", ".venv-311"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "check_models.py", "scripts"]
strict = true
follow_imports = "silent"
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["nornir.*", "nornir_netmiko.*", "netmiko.*"]
ignore_missing_imports = true
follow_imports = "skip"
